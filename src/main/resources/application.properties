spring.application.name=ticketing_system

server.port=8005
server.error.include-message= never
server.error.include-stacktrace= never
server.error.include-binding-errors= never

spring.datasource.url=jdbc:postgresql://localhost:5432/ticketing_system
spring.datasource.username=postgres
spring.datasource.password=Yakubu2020

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt.secret=+nXyg6YzHYyowFO0FnesdvlTN9eIm4XQqP8jd2P3muI=
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=2592000000

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s
# Without this a dead/unroutable Redis host blocks every request for the 10s default.
spring.data.redis.connect-timeout=2s
# If Redis needs a password, set the env var SPRING_DATA_REDIS_PASSWORD (do not hard-code it here).

# When Redis is down: false = reject /api/** with 503 (safe, default), true = let requests through unlimited.
app.rate-limit.fail-open=${RATE_LIMIT_FAIL_OPEN:false}
